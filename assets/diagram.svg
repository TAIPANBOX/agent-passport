  <line x1="832" y1="194" x2="832" y2="210" pathLength="100" stroke="#93A8C4" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-5.18s" repeatCount="indefinite"/></line>
