  <line x1="352" y1="114" x2="352" y2="134" pathLength="100" stroke="#93A8C4" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-2.59s" repeatCount="indefinite"/></line>
  <line x1="253" y1="296" x2="97"  y2="326" pathLength="100" stroke="#93A8C4" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-2.96s" repeatCount="indefinite"/></line>
  <line x1="319" y1="296" x2="267" y2="326" pathLength="100" stroke="#93A8C4" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-3.33s" repeatCount="indefinite"/></line>
  <line x1="385" y1="296" x2="437" y2="326" pathLength="100" stroke="#93A8C4" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-3.70s" repeatCount="indefinite"/></line>
  <line x1="451" y1="296" x2="607" y2="326" pathLength="100" stroke="#93A8C4" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-4.07s" repeatCount="indefinite"/></line>
  <line x1="832" y1="102" x2="832" y2="118" pathLength="100" stroke="#93A8C4" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-4.44s" repeatCount="indefinite"/></line>
