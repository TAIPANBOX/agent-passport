name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install jsonschema
        run: pip install "jsonschema==4.26.0"
      - name: Validate JSON syntax (schemas + examples)
        run: |
          for f in schemas/*.json examples/*.json; do
            echo "checking $f"
            python -m json.tool "$f" > /dev/null
          done
      - name: Validate schemas are valid draft 2020-12 JSON Schema, and examples conform to them
        run: python .github/scripts/validate_examples.py
      - name: schemas match SPEC.md
        run: ./scripts/schema-matches-spec.sh
      - name: each schema version widens the one before it, the one narrowing SPEC 6.4.1 names excepted
        run: ./scripts/version-compatibility.sh
      - name: artifacts match the SPEC 6.2 registry
        run: ./scripts/artifacts-match-registry.sh
      - name: providers match the SPEC 4.7 registry
        run: ./scripts/providers-match-registry.sh

      - name: runtimes match the SPEC 4.8 registry
        run: ./scripts/runtimes-match-registry.sh

      - name: every list of attestation methods matches the schema's enum
        run: ./scripts/attestation-methods-agree.sh

      - name: every scenario in features/ names a gate that exists
        run: ./scripts/features-are-bound.sh

      # Last, because it mutates tracked files, including schemas/ and SPEC.md,
      # and restores them. Nothing is committed and the tree is asserted clean
      # before it reports success. It needs a clean tree and says so plainly,
      # so it also reports any earlier step that starts writing into the
      # checkout.
      - name: the gates above can still fail
        run: ./scripts/gates-have-teeth.sh
